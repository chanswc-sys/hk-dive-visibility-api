name: Update HK Dive Visibility API Hourly

on:
  schedule:
    - cron: '15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pandas requests

      - name: Run Coral & Dive Sites visibility scripts
        env:
          AFCD_FCZ_API_URL: ${{ secrets.AFCD_FCZ_API_URL }}
        run: |
          if [ -f "update_visibility.py" ]; then python update_visibility.py; fi
          if [ -f "update_dive_sites_visibility.py" ]; then python update_dive_sites_visibility.py; fi

      - name: Commit and push updated JSON/CSV APIs
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add *.csv *.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update visibility API [skip ci]" && git push)
