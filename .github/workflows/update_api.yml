name: Update HK Dive Visibility API Hourly

on:
  schedule:
    - cron: '15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pandas requests

      - name: Run visibility calculation script
        env:
          AFCD_FCZ_API_URL: ${{ secrets.AFCD_FCZ_API_URL }}
        run: python update_visibility.py

      - name: Commit and push updated JSON/CSV API
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add visibility_latest.csv visibility_api.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update visibility API [skip ci]" && git push)
